name: Bug report
description: Something is wrong (NOT a security vulnerability: see SECURITY.md)
labels: [bug]
body:
  - type: markdown
    attributes: { value: "**Security issues: do not file here.** Use https://github.com/DhruvHarani1/BuildRush/security/advisories/new" }
  - type: input
    id: version
    attributes: { label: "`buildrush --version` and `node -v`, OS" }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Minimal reproduction (config + files), description: "Remove secrets. `buildrush doctor --json` output helps." }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected vs actual (include `buildrush explain` output for cache questions) }
    validations: { required: true }
