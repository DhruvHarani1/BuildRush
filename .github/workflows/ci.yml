name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions: {}
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    permissions: { contents: read }
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '${{ matrix.node }}', cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: "Dogfood (BuildRush builds and tests itself twice; second run must be fully cached)"
        shell: bash
        run: |
          node bin/buildrush.js run
          node bin/buildrush.js run --json | node -e "const r=JSON.parse(require('fs').readFileSync(0,'utf8')); if(!r.tasks.every(t=>t.state==='cached')){console.error('expected a fully cached second run');process.exit(1)}"
  audit:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm audit signatures
      - name: Package contents are exactly what we intend to ship
        run: npm run build && npm pack --dry-run --json | node -e "const p=JSON.parse(require('fs').readFileSync(0,'utf8'))[0]; const bad=p.files.filter(f=>/(^|\/)(test\/|\.github\/|\.env)/.test(f.path)); if(bad.length){console.error(bad);process.exit(1)}"
