name: Benchmarks (manual)
on:
  workflow_dispatch:
    inputs:
      workload: { description: 'small | medium | assets', default: small, required: true }
      scenarios: { description: 'comma-separated scenario keys (default all), e.g. testcache-narrow,testcache-wide,testcache-nochange', default: '', required: false }
permissions: {}
jobs:
  bench:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22', cache: npm }
      - run: npm ci && npm run build
      - run: node bench/run.mjs --workload "$WORKLOAD" --runs 7 --scenarios "${SCENARIOS:-all}"
        env: { WORKLOAD: '${{ inputs.workload }}', SCENARIOS: '${{ inputs.scenarios }}' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: bench-results, path: bench/results/ }
