name: Release
# Trigger: push a tag like v0.1.0 (tags are created by a maintainer from a green main).
on:
  push: { tags: ['v*.*.*'] }
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npm test
      - name: Tag must match package.json version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
  npm:
    needs: verify
    runs-on: ubuntu-latest
    environment: release            # protected environment: required reviewers
    permissions:
      contents: write               # attach SBOM to the GitHub release
      id-token: write               # npm provenance (OIDC)
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '22', registry-url: 'https://registry.npmjs.org', cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm sbom --sbom-format cyclonedx --omit dev > sbom.cdx.json
      - run: npm publish --provenance --access public
        env: { NODE_AUTH_TOKEN: '${{ secrets.NPM_TOKEN }}' }   # or remove when npm trusted publishing is configured
      - name: GitHub release with SBOM
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release create "${GITHUB_REF_NAME}" sbom.cdx.json --generate-notes --verify-tag
  container:
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/dhruvharani1/buildrush:${{ github.ref_name }}
